[package]
name = "linux-desktop-mcp"
version = "0.2.3"
edition = "2021"

[[bin]]
name = "linux-desktop-mcp"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
# Pure-Rust D-Bus client, used for the XDG portal screenshot backend and the
# mutter keyboard fallback. Needs thread support because zbus' blocking
# MessageIterator parks the calling thread.
zbus = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
